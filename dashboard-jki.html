<script>
/* Tiny renderer: fills the page template from the Component's values and
   updates the page in place whenever its state changes. */
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) {
    Object.assign(this.state, typeof patch === 'function' ? patch(this.state) : patch);
    if (this.__render) this.__render();
  }
  forceUpdate() { if (this.__render) this.__render(); }
}
const DC = (function () {
  const WHOLE = /^\s*\{\{\s*([\w$.]+)\s*\}\}\s*$/;
  const PART = /\{\{\s*([\w$.]+)\s*\}\}/g;
  function look(scope, path) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    let v = scope;
    for (const k of path.split('.')) { if (v == null) return undefined; v = v[k]; }
    return v;
  }
  function fill(str, scope) {
    return str.replace(PART, (m, p) => { const v = look(scope, p); return v == null ? '' : String(v); });
  }
  function build(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(fill(node.data, scope))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === 'sc-for') {
      const m = WHOLE.exec(node.getAttribute('list') || '');
      const list = (m && look(scope, m[1])) || [];
      const as = node.getAttribute('as') || 'item';
      list.forEach((item, i) => {
        const s = Object.create(scope); s[as] = item; s.$index = i;
        node.childNodes.forEach((c) => build(c, s, out));
      });
      return;
    }
    if (tag === 'sc-if') {
      const m = WHOLE.exec(node.getAttribute('value') || '');
      if (m && look(scope, m[1])) node.childNodes.forEach((c) => build(c, scope, out));
      return;
    }
    const el = node.cloneNode(false);
    el.__ev = {};
    for (const a of Array.from(node.attributes)) {
      const whole = WHOLE.exec(a.value);
      if (a.name.startsWith('hint-')) { el.removeAttribute(a.name); continue; }
      if (a.name.startsWith('on') && whole) {
        el.removeAttribute(a.name);
        const fn = look(scope, whole[1]);
        if (typeof fn === 'function') el.__ev[a.name.slice(2)] = fn;
        continue;
      }
      if (whole) {
        const v = look(scope, whole[1]);
        if (v === false || v == null) el.removeAttribute(a.name);
        else el.setAttribute(a.name, v === true ? '' : String(v));
      } else if (a.value.indexOf('{{') >= 0) {
        el.setAttribute(a.name, fill(a.value, scope));
      }
    }
    node.childNodes.forEach((c) => build(c, scope, el));
    out.appendChild(el);
  }
  function bind(el) {
    if (el.nodeType !== 1) return;
    for (const k in (el.__ev || {})) el['on' + k] = el.__ev[k];
    el.childNodes.forEach(bind);
  }
  function morph(a, b) {
    if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { bind(b); a.replaceWith(b); return; }
    if (a.nodeType === 3) { if (a.data !== b.data) a.data = b.data; return; }
    if (a.nodeType !== 1) return;
    for (const at of Array.from(a.attributes)) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
    for (const at of Array.from(b.attributes)) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
    const oldEv = a.__ev || {}, newEv = b.__ev || {};
    for (const k in oldEv) if (!(k in newEv)) a['on' + k] = null;
    for (const k in newEv) a['on' + k] = newEv[k];
    a.__ev = newEv;
    const ac = Array.from(a.childNodes), bc = Array.from(b.childNodes);
    const n = Math.min(ac.length, bc.length);
    for (let i = 0; i < n; i++) morph(ac[i], bc[i]);
    for (let i = n; i < ac.length; i++) ac[i].remove();
    for (let i = n; i < bc.length; i++) { bind(bc[i]); a.appendChild(bc[i]); }
  }
  function mount(Component) {
    const tpl = document.getElementById('dc-tpl').content;
    const root = document.getElementById('app');
    const inst = new Component({});
    let busy = false, again = false;
    const render = () => {
      if (busy) { again = true; return; }
      busy = true;
      const next = document.createElement('div');
      next.id = 'app';
      tpl.childNodes.forEach((c) => build(c, inst.renderVals(), next));
      morph(root, next);
      busy = false;
      if (again) { again = false; render(); }
    };
    render();
    inst.__render = render;
    if (inst.componentDidMount) inst.componentDidMount();
    window.addEventListener('pagehide', () => { if (inst.componentWillUnmount) inst.componentWillUnmount(); });
  }
  return { mount };
})();

</script>
<script>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { g: [[1,1,1,0],[1,1,0,0],[1,0,0,0]], last: -1, t: 0 }; }
  renderVals() {
    const names = ['Produk B · 30 ML', 'Produk C · 15 ML', 'Produk D · 60 ML'];
    const stages = ['Filling', 'Labeling', 'Cukai', 'Finishing'];
    const g = this.state.g;
    const rows = names.map((name, r) => {
      const done = g[r].every(Boolean);
      const next = g[r].indexOf(0);
      return {
        name,
        status: done ? 'Selesai' : next === 0 ? 'Antre' : stages[next],
        nameStyle: done ? 'text-decoration: line-through; color: #8094bb;' : '',
        flash: this.state.last === r ? 'animation: ahFlash 1.2s ease-out;' : '',
        cells: g[r].map((on, c) => ({
          label: name + ' ' + stages[c], pressed: on ? 'true' : 'false',
          mark: on ? '✓' : '',
          box: on ? 'background: #0a1f44;' : 'border: 1.5px solid #b8c3d8; background: #fff;',
          dot: on ? 'background: #d4af37; border-color: #d4af37;' : 'border-color: #3a5687;',
          toggle: () => {
            const n = g.map((x) => x.slice()); n[r][c] = on ? 0 : 1;
            this.setState({ g: n, last: -1, t: this.state.t + 1 });
            setTimeout(() => this.setState({ last: r }), 30);
          }
        }))
      };
    });
    return { rows, sync: this.state.t ? 'tersinkron · baru saja' : '09.30' };
  }
}
DC.mount(Component);
</script>
