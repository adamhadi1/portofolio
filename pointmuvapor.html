<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studi kasus PointMuVapor</title>
<meta name="description" content="Studi kasus PointMuVapor, mesin insentif berjadwal untuk 810 ribu kode QR.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&amp;family=Inconsolata:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>

.ah-d:focus-visible,.ah-btn:focus-visible{outline:2px solid #5BC8C0;outline-offset:3px}
</style>
<style>

</style>
</head>
<body>
<div id="app"></div>
<template id="dc-tpl">
<div style="background: #0b0c12; color: #ecebe6; font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace">

<div style="background: #5BC8C0; color: #1d1e5c; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; width: 620px; height: 620px; border-radius: 50%; background: #8FDCD6; right: -180px; top: -240px; opacity: .7"></div>
<div style="position: relative; max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: 24px 24px 0; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<a href="index.html" style="color: #1d1e5c; text-decoration: none; font-weight: 700; font-size: 14px; padding: 12px 0">← Kembali ke portofolio</a>
<span style="font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 13px">PROJECT 2 / 3</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-end">
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 18px; padding-bottom: 64px">
<span style="align-self: flex-start; font-size: 13px; font-weight: 600; background: rgba(29,30,92,.12); padding: 6px 12px; border-radius: 999px">Studi kasus · Campaign engine</span>
<h1 style="margin: 0; font-size: 54px; line-height: 1.05; font-weight: 800; letter-spacing: -.03em">Mengubah satuan <span style="color: #343594">poin jadi rupiah</span> untuk 810 ribu kode QR, terjadwal tanpa deploy</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.6; max-width: 560px; opacity: .85">Program insentif akhir tahun untuk vaporista dan pemilik toko JVS. Tarifnya menyala sendiri 1 November pukul 01:00 WIB dan berhenti setelah 31 Desember, tanpa ada yang perlu menekan tombol.</p>
<div style="display: flex; flex-wrap: wrap; gap: 32px; margin-top: 8px">
<div style="display: flex; flex-direction: column"><span style="font-size: 11px; letter-spacing: .12em; font-weight: 700; opacity: .7">PERAN</span><span style="font-weight: 700">Web Developer</span></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 11px; letter-spacing: .12em; font-weight: 700; opacity: .7">PERIODE</span><span style="font-weight: 700">Okt – Nov 2026</span></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 11px; letter-spacing: .12em; font-weight: 700; opacity: .7">TENGGAT</span><span style="font-weight: 700">2 hari sebelum program</span></div>
</div>
</div>
<div style="flex: 0 1 280px; min-width: 0; display: flex; justify-content: center; perspective: 1000px">
<div style="width: 250px; background: #111; border-radius: 34px 34px 0 0; padding: 9px 9px 0; transform: rotateY(14deg) rotateX(6deg); animation: ahFloat 6s ease-in-out infinite; box-shadow: 0 30px 60px rgba(29,30,92,.3)">
<div style="height: 380px; border-radius: 26px 26px 0 0; background: #f4f5f8; overflow: hidden; display: flex; flex-direction: column; color: #16173a; font-size: 11px">
<div style="background: #5BC8C0; color: #1d1e5c; padding: 20px 14px 12px"><span style="font-size: 10px; font-weight: 600">Halo,</span><span style="display: block; font-size: 14px; font-weight: 700">Elin Erlangga</span></div>
<div style="margin: 10px 12px 0; background: #2F3192; border-radius: 16px; padding: 13px 14px; color: #fff"><span style="font-size: 10px; font-weight: 700">Insentif Bulan Ini</span><span style="display: block; font-size: 25px; font-weight: 800; line-height: 1.05">Rp212.000</span><span style="display: inline-block; margin-top: 6px; background: rgba(255,255,255,.22); padding: 3px 8px; border-radius: 99px; font-size: 9px; font-weight: 700">40 botol · November 2026</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 12px 12px 0"><span style="border: 1.5px solid #2F3192; border-radius: 12px; padding: 8px 4px; text-align: center; font-weight: 800; color: #2F3192; font-size: 10px">Tambah Insentif</span><span style="border-radius: 12px; padding: 8px 4px; text-align: center; font-weight: 800; color: #6b6e7c; background: #e8e9ee; font-size: 10px">Cairkan Insentif</span></div>
<div style="padding: 12px; display: flex; flex-direction: column; gap: 7px">
<div style="display: flex; justify-content: space-between; background: #fff; border-radius: 11px; padding: 8px"><span><span style="display: block; font-weight: 700">NYX</span><span style="font-size: 9px; color: #5b5d7a">Insentif Scratch · 60ML</span></span><span style="font-weight: 800; color: #157f43">+Rp6.000</span></div>
<div style="display: flex; justify-content: space-between; background: #fff; border-radius: 11px; padding: 8px"><span><span style="display: block; font-weight: 700">OAT DRIP</span><span style="font-size: 9px; color: #5b5d7a">Insentif Scratch · 30ML</span></span><span style="font-weight: 800; color: #157f43">+Rp5.000</span></div>
</div>
</div>
</div>
</div>
</div>
</div>
</div>

<div style="background: #1d1e5c">
<div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: 0 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr))">
<div style="padding: 30px 20px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 36px; font-weight: 800; color: #5BC8C0">810.520</span><span style="font-size: 14px; color: #c9cae6">kode QR, dipisah menurut jenis akun yang boleh mengklaim</span></div>
<div style="padding: 30px 20px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 36px; font-weight: 800; color: #5BC8C0">66</span><span style="font-size: 14px; color: #c9cae6">pengujian otomatis untuk tarif, tanggal, dan tabrakan</span></div>
<div style="padding: 30px 20px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 36px; font-weight: 800; color: #5BC8C0">4</span><span style="font-size: 14px; color: #c9cae6">migrasi database, ditinjau manual sebelum dijalankan</span></div>
<div style="padding: 30px 20px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 36px; font-weight: 800; color: #5BC8C0">0</span><span style="font-size: 14px; color: #c9cae6">deploy saat program mulai maupun berakhir</span></div>
</div>
</div>

<div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: 96px 24px; display: flex; flex-direction: column; gap: 96px">

<section style="display: flex; flex-wrap: wrap; gap: 24px">
<div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<span style="font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 13px; letter-spacing: .16em; color: #5BC8C0">LATAR BELAKANG</span>
<h2 style="margin: 0; font-size: 38px; line-height: 1.1; font-weight: 800; letter-spacing: -.02em">Program dua bulan yang tidak boleh butuh orang jaga</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #b4b6c4">Vaporista mendapat poin dari kode di kemasan liquid. Untuk akhir tahun, manajemen minta satuannya diganti menjadi rupiah, dan hanya selama dua bulan.</p>
</div>
<div style="flex: 1 1 300px; min-width: 0; border: 1px solid rgba(255,255,255,.1); border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 13px; font-weight: 700; color: #e08a7e; letter-spacing: .1em">MASALAH</span>
<ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #c9cad3">
<li>Tanggal di dalam kode berarti dua deploy di tanggal yang tidak boleh meleset.</li>
<li>Penulisan nilai insentif berjalan di browser, bisa dipanggil lewat REST API.</li>
<li>Akun mana pun bisa mengklaim kode mana pun.</li>
<li>Waktu di dashboard admin mundur tujuh jam.</li>
</ul>
</div>
<div style="flex: 1 1 300px; min-width: 0; border: 1px solid rgba(91,200,192,.4); background: rgba(91,200,192,.06); border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 13px; font-weight: 700; color: #5BC8C0; letter-spacing: .1em">HASIL</span>
<ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #c9cad3">
<li>Tarif hidup sebagai baris bertanggal; program menyala dan mati sendiri.</li>
<li>Penulisan uang di server, RLS tanpa policy INSERT.</li>
<li>Jenis kode dicocokkan dengan jenis akun.</li>
<li>Setelah 31 Desember kembali ke tarif normal tanpa tindakan.</li>
</ul>
</div>
</section>

<section style="border: 1px solid rgba(91,200,192,.35); border-radius: 28px; padding: 40px; background: linear-gradient(160deg, #13212a, #0f1018); display: flex; flex-wrap: wrap; gap: 40px">
<div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<span style="font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 13px; letter-spacing: .16em; color: #5BC8C0">COBA SENDIRI · MESIN WAKTU</span>
<h2 style="margin: 0; font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -.02em">Pilih tanggal, lihat sistem berganti sendiri.</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #b4b6c4">Tarif berjadwal mendapat prioritas atas tarif permanen. Pencairan hanya dibuka tanggal 20 sampai akhir bulan, dihitung menurut WIB.</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px">
<sc-for list="{{dates}}" as="d" hint-placeholder-count="5">
<button class="ah-d" type="button" onClick="{{d.pick}}" style="min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid; font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 12px; cursor: pointer; {{d.style}}">{{d.label}}</button>
</sc-for>
</div>
</div>
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="background: #f4f5f8; color: #16173a; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap"><span style="font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 13px; color: #5b5d7a">{{cur.when}} WIB</span><span style="font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; {{modeStyle}}">{{cur.mode}}</span></div>
<div style="border-radius: 14px; padding: 16px; color: #fff; {{cardStyle}}"><span style="font-size: 12px; font-weight: 700; opacity: .9">{{cur.cardLabel}}</span><span style="display: block; font-size: 28px; font-weight: 800">{{cur.cardValue}}</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="background: #fff; border-radius: 12px; padding: 12px"><span style="display: block; font-size: 12px; color: #5b5d7a">NYX per kode</span><span style="font-weight: 800; font-size: 18px">{{cur.nyx}}</span></div>
<div style="background: #fff; border-radius: 12px; padding: 12px"><span style="display: block; font-size: 12px; color: #5b5d7a">OAT DRIP per kode</span><span style="font-weight: 800; font-size: 18px">{{cur.oat}}</span></div>
</div>
<div style="border-radius: 12px; padding: 12px; text-align: center; font-weight: 800; font-size: 14px; {{cairStyle}}">{{cur.cair}}</div>
</div>
<span style="font-size: 14px; color: #b4b6c4; line-height: 1.6">{{cur.why}}</span>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 720px">
<span style="font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 13px; letter-spacing: .16em; color: #5BC8C0">YANG DIBANGUN</span>
<h2 style="margin: 0; font-size: 38px; line-height: 1.1; font-weight: 800; letter-spacing: -.02em">Satu mesin tarif untuk dua program sekaligus</h2>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px">
<div class="ah-lift" style="border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 17px; font-weight: 700">Tarif Berjadwal</span><span style="font-size: 14px; color: #b4b6c4; line-height: 1.6">Setiap tarif punya waktu mulai dan selesai. Tarif lama tanpa tanggal jadi cadangan.</span></div>
<div class="ah-lift" style="border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 17px; font-weight: 700">Penulisan Uang di Server</span><span style="font-size: 14px; color: #b4b6c4; line-height: 1.6">RLS SELECT saja, tanpa policy INSERT. Identitas dari sesi, tidak dari body permintaan.</span></div>
<div class="ah-lift" style="border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 17px; font-weight: 700">Nominal Dikunci di Baris</span><span style="font-size: 14px; color: #b4b6c4; line-height: 1.6">Rupiah ditetapkan saat kode digosok. Sisa insentif tidak berubah walau tarif berhenti.</span></div>
<div class="ah-lift" style="border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 17px; font-weight: 700">Tarif per Produk</span><span style="font-size: 14px; color: #b4b6c4; line-height: 1.6">NYX Rp6.000, lainnya Rp5.000. Toko: Rp4.000 (1–50 botol), Rp5.000 (51+).</span></div>
<div class="ah-lift" style="border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 17px; font-weight: 700">Pelacakan per Produk</span><span style="font-size: 14px; color: #b4b6c4; line-height: 1.6">Setiap pencairan membawa rincian botol per produk dan ukuran yang dipilih.</span></div>
<div class="ah-lift" style="border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 17px; font-weight: 700">Pemisahan Jenis Kode</span><span style="font-size: 14px; color: #b4b6c4; line-height: 1.6">Kode toko dipindah ke produk sendiri dan dicocokkan dengan jenis akun saat klaim.</span></div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 720px">
<span style="font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 13px; letter-spacing: .16em; color: #5BC8C0">ARSITEKTUR</span>
<h2 style="margin: 0; font-size: 38px; line-height: 1.1; font-weight: 800; letter-spacing: -.02em">Aturan tarif hidup di database, bukan di kode</h2>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<div style="border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 11px; color: #8a8c9c">KLIEN</span><span style="font-weight: 700">Profil · Klaim · Pencairan</span><span style="font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 12px; color: #5BC8C0">/profile/add-point</span></div>
<div style="border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 11px; color: #8a8c9c">NEXT.JS API</span><span style="font-weight: 700">Klaim & pencairan</span><span style="font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 12px; color: #5BC8C0">/api/insentif-scratch</span></div>
<div style="border-radius: 18px; padding: 20px; background: #343594; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 11px; color: #c9cae6">LOGIKA MURNI</span><span style="font-weight: 700">Pemilih tarif & batas WIB</span><span style="font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 12px; color: #C9F0EC">pilihTierBerlaku()</span></div>
<div style="border-radius: 18px; padding: 20px; background: #5BC8C0; color: #1d1e5c; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 11px">POSTGRESQL</span><span style="font-weight: 700">Tarif bertanggal</span><span style="font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 12px">RLS SELECT · UNIQUE per kode</span></div>
</div>
</section>

<section style="display: flex; flex-wrap: wrap; gap: 24px">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<span style="font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 13px; letter-spacing: .16em; color: #5BC8C0">KUALITAS</span>
<h2 style="margin: 0; font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -.02em">Logika uang dipisah supaya bisa diuji tanpa database</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 14px"><span style="display: block; font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 20px; color: #5BC8C0">66/66</span><span style="font-size: 12px; color: #9496a6">tes hijau</span></div>
<div style="border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 14px"><span style="display: block; font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 20px; color: #5BC8C0">11</span><span style="font-size: 12px; color: #9496a6">uji batas tanggal</span></div>
<div style="border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 14px"><span style="display: block; font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 20px; color: #5BC8C0">4×</span><span style="font-size: 12px; color: #9496a6">uji balik</span></div>
</div>
</div>
<div style="flex: 1 1 420px; min-width: 0; border: 1px solid rgba(91,200,192,.4); background: rgba(91,200,192,.06); border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 8px">
<span style="font-weight: 700; color: #5BC8C0">Bug lama yang ketemu saat membaca kode</span>
<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #c9cad3">Awalan satu produk tersimpan dengan spasi (WD K7M2P91Y40). Discan berhasil, diketik tanpa spasi gagal. Menghapus spasinya justru merusak QR yang sudah tercetak, jadi solusinya kolom turunan yang dihitung Postgres sendiri.</p>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 20px">
<span style="font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 13px; letter-spacing: .16em; color: #5BC8C0">PERJALANAN</span>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<div style="border-top: 2px solid rgba(255,255,255,.2); padding-top: 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 12px; color: #8a8c9c">OKT 2026</span><span style="font-weight: 700">Memetakan sistem yang ada</span></div>
<div style="border-top: 2px solid rgba(255,255,255,.2); padding-top: 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'Consolas', 'Inconsolata', ui-monospace, monospace; font-size: 12px; color: #8a8c9c">30–31 OKT</span><span style="font-weight: 700">Tarif berjadwal & klaim di server</span></div>

<script>
/* Tiny renderer: fills the page template from the Component's values and
   updates the page in place whenever its state changes. */
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) {
    Object.assign(this.state, typeof patch === 'function' ? patch(this.state) : patch);
    if (this.__render) this.__render();
  }
  forceUpdate() { if (this.__render) this.__render(); }
}
const DC = (function () {
  const WHOLE = /^\s*\{\{\s*([\w$.]+)\s*\}\}\s*$/;
  const PART = /\{\{\s*([\w$.]+)\s*\}\}/g;
  function look(scope, path) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    let v = scope;
    for (const k of path.split('.')) { if (v == null) return undefined; v = v[k]; }
    return v;
  }
  function fill(str, scope) {
    return str.replace(PART, (m, p) => { const v = look(scope, p); return v == null ? '' : String(v); });
  }
  function build(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(fill(node.data, scope))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === 'sc-for') {
      const m = WHOLE.exec(node.getAttribute('list') || '');
      const list = (m && look(scope, m[1])) || [];
      const as = node.getAttribute('as') || 'item';
      list.forEach((item, i) => {
        const s = Object.create(scope); s[as] = item; s.$index = i;
        node.childNodes.forEach((c) => build(c, s, out));
      });
      return;
    }
    if (tag === 'sc-if') {
      const m = WHOLE.exec(node.getAttribute('value') || '');
      if (m && look(scope, m[1])) node.childNodes.forEach((c) => build(c, scope, out));
      return;
    }
    const el = node.cloneNode(false);
    el.__ev = {};
    for (const a of Array.from(node.attributes)) {
      const whole = WHOLE.exec(a.value);
      if (a.name.startsWith('hint-')) { el.removeAttribute(a.name); continue; }
      if (a.name.startsWith('on') && whole) {
        el.removeAttribute(a.name);
        const fn = look(scope, whole[1]);
        if (typeof fn === 'function') el.__ev[a.name.slice(2)] = fn;
        continue;
      }
      if (whole) {
        const v = look(scope, whole[1]);
        if (v === false || v == null) el.removeAttribute(a.name);
        else el.setAttribute(a.name, v === true ? '' : String(v));
      } else if (a.value.indexOf('{{') >= 0) {
        el.setAttribute(a.name, fill(a.value, scope));
      }
    }
    node.childNodes.forEach((c) => build(c, scope, el));
    out.appendChild(el);
  }
  function bind(el) {
    if (el.nodeType !== 1) return;
    for (const k in (el.__ev || {})) el['on' + k] = el.__ev[k];
    el.childNodes.forEach(bind);
  }
  function morph(a, b) {
    if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { bind(b); a.replaceWith(b); return; }
    if (a.nodeType === 3) { if (a.data !== b.data) a.data = b.data; return; }
    if (a.nodeType !== 1) return;
    for (const at of Array.from(a.attributes)) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
    for (const at of Array.from(b.attributes)) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
    const oldEv = a.__ev || {}, newEv = b.__ev || {};
    for (const k in oldEv) if (!(k in newEv)) a['on' + k] = null;
    for (const k in newEv) a['on' + k] = newEv[k];
    a.__ev = newEv;
    const ac = Array.from(a.childNodes), bc = Array.from(b.childNodes);
    const n = Math.min(ac.length, bc.length);
    for (let i = 0; i < n; i++) morph(ac[i], bc[i]);
    for (let i = n; i < ac.length; i++) ac[i].remove();
    for (let i = n; i < bc.length; i++) { bind(bc[i]); a.appendChild(bc[i]); }
  }
  function mount(Component) {
    const tpl = document.getElementById('dc-tpl').content;
    const root = document.getElementById('app');
    const inst = new Component({});
    let busy = false, again = false;
    const render = () => {
      if (busy) { again = true; return; }
      busy = true;
      const next = document.createElement('div');
      next.id = 'app';
      tpl.childNodes.forEach((c) => build(c, inst.renderVals(), next));
      morph(root, next);
      busy = false;
      if (again) { again = false; render(); }
    };
    render();
    inst.__render = render;
    if (inst.componentDidMount) inst.componentDidMount();
    window.addEventListener('pagehide', () => { if (inst.componentWillUnmount) inst.componentWillUnmount(); });
  }
  return { mount };
})();

</script>
<script>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { i: 2 }; }
  renderVals() {
    const D = [
      { label: '31 Okt 23:00', when: 'Sabtu, 31 Okt 2026 · 23:00', prog: false, cair: null, why: 'Belum ada tarif berjadwal yang berlaku, jadi sistem memakai tarif permanen: poin.' },
      { label: '1 Nov 01:00', when: 'Minggu, 1 Nov 2026 · 01:00', prog: true, cair: false, why: 'Detik ini tarif berjadwal mulai berlaku. Tidak ada deploy, tidak ada yang menekan tombol.' },
      { label: '20 Nov', when: 'Jumat, 20 Nov 2026 · 09:00', prog: true, cair: true, why: 'Tanggal 20 menurut WIB: tombol Cairkan terbuka sampai hari terakhir bulan.' },
      { label: '31 Des 23:59', when: 'Kamis, 31 Des 2026 · 23:59', prog: true, cair: true, why: 'Menit terakhir program. Batas selesai bersifat eksklusif, jadi 1 Januari 00:00 sudah di luar.' },
      { label: '1 Jan 2027', when: 'Jumat, 1 Jan 2027 · 00:00', prog: false, cair: null, why: 'Tarif berjadwal berhenti, sistem jatuh kembali ke poin. Sisa insentif tetap tersimpan dengan nominal aslinya.' }
    ];
    const i = this.state.i, d = D[i];
    const dates = D.map((x, k) => ({ label: x.label, pick: () => this.setState({ i: k }),
      style: k === i ? 'background: #5BC8C0; color: #1d1e5c; border-color: #5BC8C0; font-weight: 600;' : 'background: transparent; color: #c9cad3; border-color: rgba(255,255,255,.18);' }));
    const cur = {
      when: d.when,
      mode: d.prog ? 'MODE RUPIAH' : 'MODE POIN',
      cardLabel: d.prog ? 'Insentif Bulan Ini' : 'Point Bulan Ini',
      cardValue: d.prog ? 'Rp212.000' : '40 poin',
      nyx: d.prog ? 'Rp6.000' : '1 poin',
      oat: d.prog ? 'Rp5.000' : '1 poin',
      cair: d.cair === null ? 'Penukaran poin seperti biasa' : d.cair ? 'Cairkan Insentif · terbuka' : 'Cairkan Insentif · terbuka tgl 20',
      why: d.why
    };
    return {
      dates, cur,
      modeStyle: d.prog ? 'background: #2F3192; color: #fff;' : 'background: #E2F5F3; color: #0E7C72;',
      cardStyle: d.prog ? 'background: #2F3192;' : 'background: #2F8E89;',
      cairStyle: d.cair === true ? 'background: #2F3192; color: #fff;' : 'background: #e8e9ee; color: #5b5d6b;'
    };
  }
}
DC.mount(Component);
</script>
