<div style="margin: 0; color: #c4c5ca; font-size: 18px; line-height: 1.7; text-align: justify"><p data-pm-slice="1 1 []">Almost a year of managing more than 100 laptops, network infrastructure, servers, and CCTV systems at <strong>Global Excel Indonesia</strong> gave me a new perspective: <strong>the biggest challenge in IT isn't just keeping systems running, it's managing the information behind them.</strong></p><p>From asset records that still lived in spreadsheets to incident reports scattered all over the place, I saw a chance to build something more efficient.</p><p>That's where my journey as a developer began. Not just learning to write code, but building real apps to solve problems I ran into myself.</p></div><p style="margin: 0; color: #c4c5ca; font-size: 18px; line-height: 1.7; text-align: justify">Now at JVS Group, I own internal systems from start to release: database, backend, UI, and deployment. My favorite part is seeing people outside IT use the apps without needing much training.</p>

<script>
/* Tiny renderer: fills the page template from the Component's values and
   updates the page in place whenever its state changes. */
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) {
    Object.assign(this.state, typeof patch === 'function' ? patch(this.state) : patch);
    if (this.__render) this.__render();
  }
  forceUpdate() { if (this.__render) this.__render(); }
}
const DC = (function () {
  const WHOLE = /^\s*\{\{\s*([\w$.]+)\s*\}\}\s*$/;
  const PART = /\{\{\s*([\w$.]+)\s*\}\}/g;
  function look(scope, path) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    let v = scope;
    for (const k of path.split('.')) { if (v == null) return undefined; v = v[k]; }
    return v;
  }
  function fill(str, scope) {
    return str.replace(PART, (m, p) => { const v = look(scope, p); return v == null ? '' : String(v); });
  }
  function build(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(fill(node.data, scope))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === 'sc-for') {
      const m = WHOLE.exec(node.getAttribute('list') || '');
      const list = (m && look(scope, m[1])) || [];
      const as = node.getAttribute('as') || 'item';
      list.forEach((item, i) => {
        const s = Object.create(scope); s[as] = item; s.$index = i;
        node.childNodes.forEach((c) => build(c, s, out));
      });
      return;
    }
    if (tag === 'sc-if') {
      const m = WHOLE.exec(node.getAttribute('value') || '');
      if (m && look(scope, m[1])) node.childNodes.forEach((c) => build(c, scope, out));
      return;
    }
    const el = node.cloneNode(false);
    el.__ev = {};
    for (const a of Array.from(node.attributes)) {
      const whole = WHOLE.exec(a.value);
      if (a.name.startsWith('hint-')) { el.removeAttribute(a.name); continue; }
      if (a.name.startsWith('on') && whole) {
        el.removeAttribute(a.name);
        const fn = look(scope, whole[1]);
        if (typeof fn === 'function') el.__ev[a.name.slice(2)] = fn;
        continue;
      }
      if (whole) {
        const v = look(scope, whole[1]);
        if (v === false || v == null) el.removeAttribute(a.name);
        else el.setAttribute(a.name, v === true ? '' : String(v));
      } else if (a.value.indexOf('{{') >= 0) {
        el.setAttribute(a.name, fill(a.value, scope));
      }
    }
    node.childNodes.forEach((c) => build(c, scope, el));
    out.appendChild(el);
  }
  function bind(el) {
    if (el.nodeType !== 1) return;
    for (const k in (el.__ev || {})) el['on' + k] = el.__ev[k];
    el.childNodes.forEach(bind);
  }
  function morph(a, b) {
    if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { bind(b); a.replaceWith(b); return; }
    if (a.nodeType === 3) { if (a.data !== b.data) a.data = b.data; return; }
    if (a.nodeType !== 1) return;
    for (const at of Array.from(a.attributes)) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
    for (const at of Array.from(b.attributes)) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
    const oldEv = a.__ev || {}, newEv = b.__ev || {};
    for (const k in oldEv) if (!(k in newEv)) a['on' + k] = null;
    for (const k in newEv) a['on' + k] = newEv[k];
    a.__ev = newEv;
    const ac = Array.from(a.childNodes), bc = Array.from(b.childNodes);
    const n = Math.min(ac.length, bc.length);
    for (let i = 0; i < n; i++) morph(ac[i], bc[i]);
    for (let i = n; i < ac.length; i++) ac[i].remove();
    for (let i = n; i < bc.length; i++) { bind(bc[i]); a.appendChild(bc[i]); }
  }
  function mount(Component) {
    const tpl = document.getElementById('dc-tpl').content;
    const root = document.getElementById('app');
    const inst = new Component({});
    let busy = false, again = false;
    const render = () => {
      if (busy) { again = true; return; }
      busy = true;
      const next = document.createElement('div');
      next.id = 'app';
      tpl.childNodes.forEach((c) => build(c, inst.renderVals(), next));
      morph(root, next);
      busy = false;
      if (again) { again = false; render(); }
    };
    render();
    inst.__render = render;
    if (inst.componentDidMount) inst.componentDidMount();
    window.addEventListener('pagehide', () => { if (inst.componentWillUnmount) inst.componentWillUnmount(); });
  }
  return { mount };
})();

</script>
<script>
class Component extends DCLogic {
  constructor(p){
    super(p);
    this.state = { rx: 0, ry: 0, act: 0, dragging: false, cells: Array(9).fill(null), score: 0, t: 20000, running: false, done: false, msg: null, msgKind: 'idle' };
    this.BUGS = ['Clock 7 hrs behind', 'Space in QR code', 'Empty record', 'ON CONFLICT', 'Flickering label', 'Login to localhost', 'Lost SKU zeros', 'Cut-off WA link'];
  }
  componentDidMount(){
    this.autoOn = true;
    this.av = setInterval(() => { if (this.autoOn && !this.d) this.goFace((this.state.act + 1) % 6); }, 3200);
  }
  componentWillUnmount(){ clearInterval(this.iv); clearInterval(this.av); }
  goFace(i){
    const near = (cur, base) => base + 360 * Math.round((cur - base) / 360);
    const ry = this.state.ry;
    if (i === 4) this.setState({ act: 4, rx: -90, ry: near(ry, 0), dragging: false });
    else if (i === 5) this.setState({ act: 5, rx: 90, ry: near(ry, 0), dragging: false });
    else this.setState({ act: i, rx: 0, ry: near(ry, -90 * i), dragging: false });
  }
  tick(){
    const s = this.state, t = s.t - 700;
    if (t <= 0) { clearInterval(this.iv); this.setState({ t: 0, running: false, done: true, cells: Array(9).fill(null), msg: "Time's up.", msgKind: 'idle' }); return; }
    const cells = s.cells.map((c) => (c && c.age < 2 ? Object.assign({}, c, { age: c.age + 1 }) : null));
    const n = Math.random() < 0.35 ? 2 : 1;
    for (let k = 0; k < n; k++) {
      const empty = cells.map((c, i) => (c ? -1 : i)).filter((i) => i >= 0);
      if (!empty.length) break;
      const at = empty[Math.floor(Math.random() * empty.length)];
      cells[at] = Math.random() < 0.25 ? { kind: 'ok', age: 0 } : { kind: 'bug', age: 0, label: this.BUGS[Math.floor(Math.random() * this.BUGS.length)] };
    }
    this.setState({ t, cells });
  }
  renderVals() {
    const s = this.state;
    const meta = [
      { label: 'Pointmu', href: 'pointmu.html', cta: 'Read the Pointmu.id case study →' },
      { label: 'Vapor', href: 'pointmuvapor.html', cta: 'Read the PointMuVapor case study →' },
      { label: 'JKI', href: 'dashboard-jki.html', cta: 'Read the Dashboard JKI case study →' },
      { label: 'Assets', href: '#projects', cta: 'See it in Projects ↓' },
      { label: 'Monitoring', href: '#projects', cta: 'See it in Projects ↓' },
      { label: 'Contact', href: '#contact', cta: 'Jump to contact ↓' }
    ];
    const sides = meta.map((m, i) => ({
      label: m.label, on: i === s.act ? 'true' : 'false',
      style: i === s.act ? 'background: #ecebe6; color: #0b120f; border-color: #ecebe6;' : 'background: transparent; color: #c4c5ca; border-color: rgba(255,255,255,.18);',
      pick: () => { this.autoOn = false; this.goFace(i); }
    }));

    const cells = s.cells.map((c, i) => ({
      isBug: !!c && c.kind === 'bug', isOk: !!c && c.kind === 'ok', label: c && c.label ? c.label : '',
      aria: c ? (c.kind === 'bug' ? 'Bug: ' + c.label : 'Working code') : 'Empty cell',
      hit: () => {
        if (!s.running || !c) return;
        const next = s.cells.slice(); next[i] = null;
        if (c.kind === 'bug') this.setState({ cells: next, score: s.score + 10, msg: 'Got it: ' + c.label, msgKind: 'good' });
        else this.setState({ cells: next, score: Math.max(0, s.score - 5), msg: 'Oops, that code was fine', msgKind: 'bad' });
      }
    }));
    const msgStyles = { idle: 'color: #a6a7ad;', good: 'color: #86dcaa;', bad: 'color: #f5a090;' };
    const rank = s.score >= 150 ? 'SENIOR DEBUGGER' : s.score >= 80 ? 'BUG HUNTER' : 'JUNIOR DEBUGGER';
    const rankNote = s.score >= 150 ? 'Great reflexes! Email me your score, I want to know.' : s.score >= 80 ? 'Not bad! Real-world bugs are sneakier than this.' : "No worries, my first bug got away too. One more try?";
    return {
      sides, cur: meta[s.act],
      cubeT: 'transform: rotateX(' + s.rx + 'deg) rotateY(' + s.ry + 'deg); transition: ' + (s.dragging ? 'none' : 'transform .9s cubic-bezier(.2,.7,.2,1)') + ';',
      down: (e) => {
        this.autoOn = false;
        this.d = { x: e.clientX, y: e.clientY, rx: s.rx, ry: s.ry };
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
        this.setState({ dragging: true });
      },
      drag: (e) => {
        if (!this.d) return;
        const rx = Math.max(-90, Math.min(90, this.d.rx - (e.clientY - this.d.y) * 0.6));
        this.setState({ rx, ry: this.d.ry + (e.clientX - this.d.x) * 0.6 });
      },
      up: () => {
        if (!this.d) return;
        this.d = null;
        const st = this.state;
        if (st.rx < -45) this.goFace(4);
        else if (st.rx > 45) this.goFace(5);
        else this.goFace(((Math.round(-st.ry / 90) % 4) + 4) % 4);
      },
      cells, score: s.score, secs: Math.ceil(s.t / 1000), running: s.running, done: s.done,
      msg: s.msg || 'Ready?', msgStyle: msgStyles[s.msgKind],
      startBug: () => {
        clearInterval(this.iv);
        this.setState({ cells: Array(9).fill(null), score: 0, t: 20000, running: true, done: false, msg: 'Go!', msgKind: 'idle' });
        this.iv = setInterval(() => this.tick(), 700);
      },
      startLabel: s.running ? 'Playing...' : s.done ? 'Play again' : 'Start',
      startStyle: s.running ? 'opacity: .5; cursor: default;' : '',
      rank, rankNote
    };
  }
}
DC.mount(Component);
</script>
